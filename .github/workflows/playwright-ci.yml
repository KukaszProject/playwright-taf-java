name: Demo TAF CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      env_choice:
        description: 'Target Environment (Manual Run)'
        required: true
        default: 'qa'
        type: choice
        options:
          - dev
          - qa
          - staging
          - prod

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.set-matrix.outputs.envs }}
    steps:
      - name: Set Environments Matrix
        id: set-matrix
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # If triggered manually, only run the selected environment
            echo "envs=[\"${{ github.event.inputs.env_choice }}\"]" >> $GITHUB_OUTPUT
          else
            # If triggered by a code push, run the full deployment pipeline
            echo "envs=[\"dev\", \"qa\", \"staging\", \"prod\"]" >> $GITHUB_OUTPUT
          fi

  execute-tests:
    needs: prepare-matrix
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 1 
      fail-fast: true 
      matrix:
        environment: ${{ fromJson(needs.prepare-matrix.outputs.environments) }}
    
    environment: ${{ matrix.environment }}
    
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: 3. Install Playwright Browsers & Dependencies
        run: mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps"
      
      - name: 4. Run Tests on [${{ matrix.environment }}]
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: mvn clean test -Denv=${{ matrix.environment }}

      - name: 5. Upload Allure Results Artifact
        uses: actions/upload-artifact@v4
        if: always() 
        with:
          name: allure-results-${{ matrix.environment }}
          path: target/allure-results
          retention-days: 1

  publish-report:
    needs: execute-tests
    runs-on: ubuntu-latest
    if: always() 
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Download Allure Results from all environments
        uses: actions/download-artifact@v4
        with:
          path: target/allure-results
          pattern: allure-results-*
          merge-multiple: true

      - name: 3. Generate Allure Report
        uses: simple-elf/allure-report-action@master
        id: allure-report
        with:
          allure_results: target/allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history

      - name: 4. Deploy Dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history